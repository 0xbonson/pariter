name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-contracts:
    name: Foundry Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Unit & Fuzz Tests
        run: |
          cd contracts
          forge test -vvv

  test-frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: |
          cd web
          npm ci

      - name: Run Vitest Unit Tests
        run: |
          cd web
          npm test

      - name: Build Web Application
        env:
          VITE_BATCH_PAYOUT_ADDRESS: ${{ vars.VITE_BATCH_PAYOUT_ADDRESS || secrets.VITE_BATCH_PAYOUT_ADDRESS || '' }}
        run: |
          cd web
          npm run build
